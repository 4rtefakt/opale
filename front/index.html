<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opale</title>
<link rel="icon" type="image/svg+xml" href="/branding/icon.svg">
<!-- Tabler Icons — vendorisé par setup.sh (version figée, SHA-256 vérifié) -->
<link rel="stylesheet" href="/tabler-icons-webfont/tabler-icons.min.css">
<link rel="stylesheet" href="/styles/main.css">
<meta name="theme-color" content="#ffffff">
<script src="/env.js"></script>
<script src="/theme.js"></script>
<script>
  // Hydrate les éléments [data-brand="<champ>"] depuis window.ENV.BRANDING.
  // Champs supportés : org_name, product_name, tagline, default_role_label.
  document.addEventListener('DOMContentLoaded', () => {
    const b = window.ENV && window.ENV.BRANDING
    if (!b) return
    if (b.product_name) document.title = b.product_name
    document.querySelectorAll('[data-brand]').forEach(el => {
      const k = el.getAttribute('data-brand')
      if (b[k]) el.textContent = b[k]
    })
  })
</script>
<script src="/msal-browser.min.js"></script>
</head>
<body>

<!-- CHARGEMENT -->
<div id="view-loading" class="view-loading">
  <div class="loading-spinner"></div>
</div>

<!-- ECRAN LOGIN -->
<div id="view-login" style="display:none;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-tertiary)">
  <div style="text-align:center">
    <img src="/branding/icon.svg" alt="" style="width:56px;height:56px;margin-bottom:14px">
    <div style="font-size:20px;font-weight:500;margin-bottom:6px;color:var(--text-primary)" data-brand="product_name">Opale</div>
    <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:28px"><span data-brand="org_name">Your Organization</span> — <span data-brand="tagline">Open RMM platform</span></div>
    <button id="btn-login" class="btn btn-primary" style="font-size:13px;padding:9px 20px">
      <i class="ti ti-brand-azure"></i> Se connecter avec Microsoft 365
    </button>
  </div>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none">

  <!-- TOP NAV -->
  <header class="topnav">
    <a class="brand" href="#/today">
      <img src="/branding/icon.svg" alt="" class="brand-icon">
      <span class="brand-name" data-brand="product_name">Opale</span>
    </a>
    <nav class="topnav-links" aria-label="Navigation">
      <a class="topnav-link" href="#/today" data-route="today" data-module="core"><i class="ti ti-sun"></i> <span data-i18n="nav.today">Aujourd'hui</span></a>
      <a class="topnav-link" href="#/tickets" data-route="tickets" data-module="tickets"><i class="ti ti-ticket"></i> <span data-i18n="nav.tickets">Tickets</span>
        <span class="topnav-badge" id="badge-tickets" style="display:none" title="À répondre / à trier"></span>
      </a>
      <a class="topnav-link" href="#/postes" data-route="postes" data-module="inventory"><i class="ti ti-device-laptop"></i> <span data-i18n="nav.postes">Postes</span></a>
      <a class="topnav-link" href="#/alertes" data-route="alertes" data-module="monitoring"><i class="ti ti-bell"></i> <span data-i18n="nav.alertes">Alertes</span>
        <span class="topnav-badge" id="badge-alertes" style="display:none"></span>
      </a>
      <div class="topnav-more" id="topnav-more">
        <button class="topnav-link" type="button" onclick="toggleMoreMenu(event)" aria-haspopup="true" aria-expanded="false"><i class="ti ti-grid-dots"></i> <span data-i18n="nav.more">Plus</span> <i class="ti ti-chevron-down" style="font-size:12px"></i></button>
        <div class="more-menu hidden" id="more-menu">
          <a class="more-item" href="#/dashboard" data-module="core"><i class="ti ti-layout-dashboard"></i> <span data-i18n="nav.dashboard">Tableau de bord</span></a>
          <a class="more-item" href="#/conformite" data-module="monitoring"><i class="ti ti-shield-check"></i> <span data-i18n="nav.conformite">Conformité</span></a>
          <a class="more-item" href="#/reseau" data-module="monitoring"><i class="ti ti-network"></i> <span data-i18n="nav.reseau">Réseau</span></a>
          <a class="more-item" href="#/stock" data-module="inventory"><i class="ti ti-package"></i> <span data-i18n="nav.stock">Stock</span></a>
          <a class="more-item" href="#/users" data-module="core"><i class="ti ti-users"></i> <span data-i18n="nav.users">Utilisateurs</span></a>
          <a class="more-item" href="#/groupes" data-module="groups"><i class="ti ti-circles"></i> <span data-i18n="nav.groupes">Groupes</span></a>
          <div class="more-sep"></div>
          <a class="more-item" href="#/packages" data-module="inventory"><i class="ti ti-rocket"></i> <span data-i18n="nav.packages">Déploiement</span></a>
          <a class="more-item" href="#/scripts" data-module="inventory"><i class="ti ti-terminal-2"></i> <span data-i18n="nav.scripts">Scripts</span></a>
          <a class="more-item" href="#/onboarding" data-module="onboarding"><i class="ti ti-checklist"></i> <span data-i18n="nav.onboarding">Onboarding</span></a>
          <a class="more-item" href="#/rapports" data-module="monitoring"><i class="ti ti-chart-bar"></i> <span data-i18n="nav.rapports">Rapports</span></a>
          <a class="more-item" href="#/point" data-module="monitoring"><i class="ti ti-clipboard-text"></i> <span data-i18n="nav.point">Point info</span></a>
          <div class="more-sep"></div>
          <a class="more-item" href="#/audit" data-module="core"><i class="ti ti-history"></i> <span data-i18n="nav.audit">Audit</span></a>
          <a class="more-item" href="#/parametres" data-module="core"><i class="ti ti-settings"></i> <span data-i18n="nav.parametres">Paramètres</span></a>
        </div>
      </div>
    </nav>
    <div class="topnav-right">
      <button class="topnav-search" id="ask-bar-trigger" data-module="ask" type="button" aria-label="Demander à Opale" title="Demander à Opale (⌘K)">
        <i class="ti ti-sparkles"></i><span id="ask-bar-text">Demander à Opale…</span><kbd>⌘K</kbd>
      </button>
      <button class="btn btn-primary btn-sm" id="topnav-new" onclick="openQuickTicket()" title="Nouveau ticket (n)" data-module="tickets"><i class="ti ti-plus"></i> <span data-i18n="btn.new_ticket">Nouveau ticket</span></button>
      <div class="topnav-user" id="sidebar-user-btn" onclick="toggleUserMenu()" title="Menu utilisateur">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div id="user-menu" class="user-menu hidden" onclick="event.stopPropagation()">
          <div class="user-menu-head"><div class="avatar-name" id="sidebar-name">—</div><div class="avatar-role" id="sidebar-role" data-brand="default_role_label">IT</div></div>
          <a class="user-menu-item" href="#/parametres" onclick="toggleUserMenu()"><i class="ti ti-palette"></i> <span data-i18n="settings.appearance.title">Apparence</span></a>
          <button class="user-menu-item" onclick="window.auth.logout()"><i class="ti ti-logout"></i> Déconnexion</button>
          <div class="user-menu-modes">
            <div class="seg" id="user-menu-mode-seg">
              <button class="seg-btn" data-mode="system" onclick="setThemeMode('system')" title="Système"><i class="ti ti-device-desktop"></i></button>
              <button class="seg-btn" data-mode="light"  onclick="setThemeMode('light')"  title="Clair"><i class="ti ti-sun"></i></button>
              <button class="seg-btn" data-mode="dark"   onclick="setThemeMode('dark')"   title="Sombre"><i class="ti ti-moon"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main" id="main-area">
    <div id="view-today"     class="view"></div>
    <div id="view-dashboard" class="view"></div>
    <div id="view-postes"    class="view"></div>
    <div id="view-conformite" class="view"></div>
    <div id="view-reseau"    class="view"></div>
    <div id="view-alertes"   class="view"></div>
    <div id="view-tickets"   class="view"></div>
    <div id="view-stock"     class="view"></div>
    <div id="view-users"     class="view"></div>
    <div id="view-scripts"   class="view"></div>
    <div id="view-onboarding" class="view"></div>
    <div id="view-rapports"  class="view"></div>
    <div id="view-point"     class="view"></div>
    <div id="view-audit"     class="view"></div>
    <div id="view-parametres" class="view"></div>
    <div id="view-packages"  class="view"></div>
    <div id="view-groupes"   class="view"></div>
    <div id="view-404" class="view" style="display:none">
      <div class="empty-state" style="height:100%">
        <i class="ti ti-mood-confuzed"></i>
        <p>Page introuvable</p>
      </div>
    </div>
  </div>
</div>


<!-- MODAL -->
<div id="modal-overlay" class="hidden">
  <div id="modal-content"></div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
